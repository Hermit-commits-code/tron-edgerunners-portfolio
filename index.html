<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERDECK // CORE_OS</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <div class="hud-container">
      <!-- Header Bar -->
      <header class="hud-panel cell-header">
        <div class="glitch-text" data-text="SYSTEM: ACTIVE">SYSTEM: ACTIVE</div>
        <div class="header-timestamp" id="hud-clock">00:00:00 SYS_LOC</div>
      </header>

      <!-- Section 1 CORE IDENTITY -->
      <section id="core" class="hud-panel cell-hero">
        <div class="panel-tag">[01 // CORE_ID]</div>
        <h1 class="main-title">JOSEPH</h1>
        <p class="sub-title">// FULL-STACK CREATIVE ARCHITECT</p>

        <!-- EDGERUNNERS STYLE HIGH-CONTRAST ACCENT BANNER -->
        <div class="hazard-banner">
          <span class="banner-text">WARNING: SYSTEM OVERCLOCK ACTIVE</span>
        </div>

        <!-- Interactive Mini Boot Log -->
        <div class="boot-terminal">
          <div class="terminal-line">>> STACK_INIT: SUCCESSFUL...</div>
          <div class="terminal-line">>> LINK_ESTABLISHED: PORT_443...</div>
          <div class="terminal-line" id="dynamic-log">>> LOADING PERIPHERALS...</div>
        </div>
      </section>

      <!-- SECTION 2 PROJECTS -->
      <section id="files" class="hud-panel cell-projects">
        <!-- Project Matrices go here -->
      </section>

      <!-- SECTION 3: TECH STACK -->
      <section id="tech" class="hud-panel cell-skills">
        <!-- Brutalist layout grids -->
      </section>

      <!-- SECTION 4: LOG BOOK (EXPERIENCE) -->
      <section id="logs" class="hud-panel cell-experience">
        <!-- Structural timelines -->
      </section>

      <!-- SECTION 5: UPLINK (CONTACT) -->
      <footer id="uplink" class="hud-panel cell-contact">
        <!-- Secure handshake console -->
      </footer>
    </div>
    <script src="app.js"></script>
  </body>

</html>
